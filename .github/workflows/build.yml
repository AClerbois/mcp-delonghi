name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/McpDelonghi/McpDelonghi.csproj

      - name: Build
        run: dotnet build src/McpDelonghi/McpDelonghi.csproj -c Release --no-restore
